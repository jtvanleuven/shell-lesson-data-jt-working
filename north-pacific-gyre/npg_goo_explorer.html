<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Pacific Gyre — Goo Data Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0a0e17;
  color: #e2e8f0;
  height: 100vh;
  display: flex;
  overflow: hidden;
}
/* Sidebar */
#sidebar {
  width: 280px; min-width: 280px;
  background: #111827;
  border-right: 1px solid #1e293b;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
#sidebar h1 {
  font-size: 15px; font-weight: 700;
  padding: 18px 16px 4px; color: #f8fafc;
}
#sidebar .sub {
  font-size: 11px; padding: 0 16px 14px;
  color: #64748b; border-bottom: 1px solid #1e293b;
}
.section-label {
  font-size: 10px; font-weight: 700; color: #475569;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 12px 16px 6px;
}
.file-group { border-bottom: 1px solid #1a2332; }
.file-group-title {
  font-size: 10px; font-weight: 600; color: #64748b;
  padding: 4px 16px; text-transform: uppercase; letter-spacing: 0.5px;
}
.file-item {
  padding: 5px 16px 5px 20px; cursor: pointer;
  font-size: 13px; display: flex; align-items: center; gap: 8px;
  transition: background 0.12s;
}
.file-item:hover { background: #1e293b; }
.file-item.selected { background: #1e3a5f; }
.file-item.suspect { color: #f59e0b; }
.file-item.suspect.selected { background: #78350f; }
.suffix-badge {
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 3px; min-width: 18px; text-align: center;
}
.badge-A { background: #1e3a5f; color: #93c5fd; }
.badge-B { background: #064e3b; color: #6ee7b7; }
.badge-Z { background: #78350f; color: #fcd34d; }
.suspect-icon { font-size: 11px; margin-left: auto; }
/* Main */
#main { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:20px; }
.view-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
.card {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.card h3 {
  font-size: 12px; font-weight: 600; color: #94a3b8;
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
}
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
}
.stat-box {
  background: #0a0e17; border-radius: 6px; padding: 12px; text-align: center;
}
.stat-box .label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
.stat-box .value { font-size: 18px; font-weight: 700; color: #f8fafc; }
.stat-box .value.warn { color: #f59e0b; }
.chart-container { position: relative; height: 300px; }
.chart-container.tall { height: 350px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  text-align: left; padding: 8px 10px; background: #0a0e17;
  color: #94a3b8; font-weight: 600;
  border-bottom: 2px solid #1e293b; position: sticky; top: 0;
}
.data-table td { padding: 6px 10px; border-bottom: 1px solid #1a2332; }
.data-table tr:hover td { background: #1e293b; }
.data-table .outlier { color: #f59e0b; font-weight: 700; }
.table-wrap { max-height: 350px; overflow-y: auto; border-radius: 6px; border: 1px solid #1e293b; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab {
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  border-radius: 6px; cursor: pointer;
  background: #111827; color: #64748b;
  border: 1px solid #1e293b; transition: all 0.15s;
}
.tab:hover { background: #1e293b; }
.tab.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.legend { display: flex; gap: 16px; margin-bottom: 8px; font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.alert-banner {
  background: #78350f; border: 1px solid #f59e0b;
  border-radius: 6px; padding: 10px 14px;
  font-size: 13px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.alert-banner .icon { font-size: 18px; }
.flag-suspect {
  display: inline-block; font-size: 10px;
  background: #f59e0b; color: #0a0e17;
  padding: 1px 6px; border-radius: 3px; font-weight: 700;
}
.back-link {
  display: inline-block; margin-bottom: 16px;
  font-size: 13px; color: #64748b;
  text-decoration: none;
}
.back-link:hover { color: #e2e8f0; }
</style>
</head>

const SUSPECT = {"NENE02018B": "Truncated: only 240 lines (expected 300)", "NENE01971Z": "Extreme outlier: 11.08 at line 206 (~10\u03c3 above mean)"};
const COLORS = { A: '#3b82f6', B: '#10b981', Z: '#f59e0b' };

let selectedFile = null;
let activeTab = 'timeseries';
let charts = [];

function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }
function getSuffix(n) { const m = n.match(/([A-Z])$/); return m ? m[1] : 'A'; }
function getSampleNum(n) { const m = n.match(/NENE(\d+)/); return m ? m[1] : n; }
function hexRGBA(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function computeStats(vals) {
  const n = vals.length;
  const mean = vals.reduce((a,b) => a+b, 0) / n;
  const std = Math.sqrt(vals.reduce((a,b) => a + (b-mean)**2, 0) / n);
  const sorted = [...vals].sort((a,b) => a-b);
  const median = n % 2 ? sorted[n>>1] : (sorted[n/2-1]+sorted[n/2])/2;
  return { n, mean, std, min: sorted[0], max: sorted[n-1], median,
           q1: sorted[Math.floor(n*0.25)], q3: sorted[Math.floor(n*0.75)] };
}

function groupFiles() {
  const groups = {};
  Object.keys(DATA).sort().forEach(name => {
    const num = getSampleNum(name);
    if (!groups[num]) groups[num] = [];
    groups[num].push(name);
  });
  return groups;
}

function renderSidebar() {
  const list = document.getElementById('file-list');
  const groups = groupFiles();
  let html = '';
  Object.entries(groups).forEach(([num, files]) => {
    html += `<div class="file-group"><div class="file-group-title">Sample ${{num}}</div>`;
    files.forEach(name => {
      const s = getSuffix(name);
      const isSuspect = SUSPECT[name] !== undefined;
      const sel = selectedFile === name ? 'selected' : '';
      html += `<div class="file-item ${{sel}} ${{isSuspect ? 'suspect' : ''}}" onclick="selectFile('${name}')">
        <span class="suffix-badge badge-${s}">${s}</span>
        ${{name}}
        ${{isSuspect ? '<span class="suspect-icon">⚠️</span>' : ''}}
      </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

function selectFile(name) {
  selectedFile = (selectedFile === name) ? null : name;
  if (selectedFile) activeTab = 'timeseries';
  render();
}

function setTab(tab) { activeTab = tab; render(); }

function render() {
  destroyCharts();
  renderSidebar();
  const main = document.getElementById('main');
  if (!selectedFile) renderOverview(main);
  else renderFileView(main, selectedFile);
}

function renderOverview(main) {
  const allVals = Object.values(DATA).flat();
  const gs = computeStats(allVals);
  let html = `<a class="back-link" href="../index.html">← Back to all explorations</a>`;
  html += `<div class="view-title">Overview Dashboard</div>`;
  html += `<div class="alert-banner"><span class="icon">⚠️</span>

  html += `<div class="card"><h3>Dataset Summary</h3>

  let html = `<a class="back-link" href="#" onclick="selectedFile=null;render();return false;">← Back to overview</a>`;
  html += `<div class="view-title">${name}</div>`;
  if (isSuspect) {
    html += `<div class="alert-banner"><span class="icon">⚠️</span> <strong>Suspect:</strong> ${SUSPECT[name]}</div>`;
  }

  html += `<div class="card"><h3>Statistics</h3>
    <div class="stats-grid">
      <div class="stat-box"><div class="label">Count</div><div class="value">${s.n}</div></div>
      <div class="stat-box"><div class="label">Mean</div><div class="value">${s.mean.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Median</div><div class="value">${s.median.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Std Dev</div><div class="value">${s.std.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Min</div><div class="value">${s.min.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Max</div><div class="value ${s.max > s.mean+3*s.std ? 'warn' : ''}">${s.max.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Q1</div><div class="value">${s.q1.toFixed(4)}</div></div>
      <div class="stat-box"><div class="label">Q3</div><div class="value">${s.q3.toFixed(4)}</div></div>
    </div>
  </div>`;

  html += `<div class="tabs">
    <div class="tab ${activeTab==='timeseries'?'active':''}" onclick="setTab('timeseries')">Time Series</div>
    <div class="tab ${activeTab==='histogram'?'active':''}" onclick="setTab('histogram')">Histogram</div>
    <div class="tab ${activeTab==='datatable'?'active':''}" onclick="setTab('datatable')">Raw Data</div>
  </div>`;

  if (activeTab === 'timeseries') {
    html += `<div class="card"><h3>Time Series (Row Index vs Value)</h3>
      <div class="chart-container tall"><canvas id="tsChart"></canvas></div>
    </div>`;
  } else if (activeTab === 'histogram') {
    html += `<div class="card"><h3>Histogram (15 bins)</h3>
      <div class="chart-container tall"><canvas id="histChart"></canvas></div>
    </div>`;
  } else {
    html += `<div class="card"><h3>Raw Data</h3>
      <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Row #</th><th>Value</th><th>Z-score</th></tr></thead>
        <tbody>`;
    vals.forEach((v, i) => {
      const z = (v - s.mean) / s.std;
      const isOut = Math.abs(z) > 3;
      html += `<tr class="${isOut?'outlier':''}">
        <td>${i+1}</td><td>${v.toFixed(10)}</td>
        <td>${isOut ? '⚠️ ' : ''}${z.toFixed(3)}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  }
  main.innerHTML = html;

  if (activeTab === 'timeseries') {
    const indices = vals.map((_, i) => i + 1);
    const ctx = document.getElementById('tsChart').getContext('2d');
    charts.push(new Chart(ctx, {
      type: 'line',
      data: { labels: indices, datasets: [{
        label: 'Value', data: vals,
        borderColor: color, backgroundColor: hexRGBA(color, 0.08),
        pointRadius: vals.map(v => Math.abs(v-s.mean) > 3*s.std ? 5 : 0),
        pointBackgroundColor: vals.map(v => Math.abs(v-s.mean) > 3*s.std ? '#f59e0b' : color),
        borderWidth: 1.5, fill: true, tension: 0.1
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: {
            title: items => `Row ${items[0].label}`,
            label: item => `Value: ${item.parsed.y.toFixed(6)}`
          }}},
        scales: {
          x: { ticks: { color:'#94a3b8', maxTicksLimit:10 }, grid: { color:'#1a2332' },
               title: { display: true, text: 'Row Index', color:'#64748b' } },
          y: { ticks: { color:'#94a3b8' }, grid: { color:'#1a2332' },
               title: { display: true, text: 'Value', color:'#64748b' } }
        }
      }
    }));
  } else if (activeTab === 'histogram') {
    const numBins = 15;
    const binW = (s.max - s.min) / numBins;
    const bins = new Array(numBins).fill(0);
    const labels = [];
    for (let i = 0; i < numBins; i++) {
      const lo = s.min + i * binW, hi = lo + binW;
      bins[i] = vals.filter(v => v >= lo && (i === numBins-1 ? v <= hi : v < hi)).length;
      labels.push(lo.toFixed(2));
    }
    const ctx = document.getElementById('histChart').getContext('2d');
    charts.push(new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{
        label: 'Frequency', data: bins,
        backgroundColor: hexRGBA(color, 0.6), borderColor: color,
        borderWidth: 1, borderRadius: 2
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color:'#94a3b8', font:{size:10} }, grid: { color:'#1a2332' },
               title: { display: true, text: 'Value', color:'#64748b' } },
          y: { ticks: { color:'#94a3b8' }, grid: { color:'#1a2332' },
               title: { display: true, text: 'Count', color:'#64748b' } }
        }
      }
    }));
  }
}

render();
</script>
</body>
</html>
